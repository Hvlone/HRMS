<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .dropdown-menu {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body>
<form id="houseForm" enctype="multipart/form-data">
    标题：<input name="title"/><br/>
    地址：<input name="address"/><br/>
    租金：<input name="price"/><br/>
    面积：<input name="area"/><br/>
    描述：<input name="description"/><br/>
    图片：<input type="file" name="pics" multiple /><br/>
    <button type="submit">发布房源</button>
</form>
<div class="dropdown">
    <span class="dropdown-toggle">张师傅</span>
    <div class="dropdown-menu">
        <a href="#">个人中心</a>
        <a href="#">账户设置</a>
        <a href="#">我的评价</a>
        <a href="#">退出登录</a>
    </div>
</div>
<script>
    document.getElementById('houseForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            const res =await fetch('/house/addHouse', {
                method: 'POST',
                body: new FormData(this)
            });

            // 1. 解析成 ApiResponse 格式
            const api = await res.json();
            // 2. 按 code 判断
            if (api.code === 200) {
                alert(api.message);          // "添加房源成功！"
                // 成功后跳转 / 清空表单
                this.reset();
                // location.href = '/house/list'; // 例：跳到列表页
            } else {
                alert('失败：' + api.message); // "添加房源失败"
            }

        });
</script>
</body>
</html>
